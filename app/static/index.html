<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>광주 졸업식 일정 도우미</title>
  <link rel="stylesheet" href="/static/schedule.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/schedule.js" defer></script><script src="/static/app.js" defer></script>
</head>
<body><main>
  <header><div class="eyebrow">우리 동네 학교 일정</div><h1>광주 졸업식 일정 도우미</h1>
  <div class="season-bar"><label>저장된 시즌 <select id="season-select"></select></label><span id="season-range"></span></div></header>
  <p id="message" role="status" aria-live="polite" hidden></p>
  <div class="input-panels">
    <section class="panel" aria-labelledby="research-title"><h2 id="research-title">일정찾기</h2>
      <p class="hint">광주 학교의 졸업식 날짜와 인원수를 찾아요.</p>
      <form id="research-form" class="actions"><button class="primary" type="submit" id="research-submit">이 시즌 다시 조사</button><button id="add-season" type="button">새 시즌 조사</button></form>
      <div id="job" hidden><p id="job-message" role="status"></p><div class="actions" id="job-actions"></div></div>
    </section>
    <section class="panel" aria-labelledby="record-title"><h2 id="record-title">직접 확인한 내용</h2>
      <p class="hint">전화나 안내문으로 확인한 내용을 편하게 적어 주세요.</p>
      <div id="conversation" aria-live="polite"></div>
      <form id="record-form">
        <label class="sr-only" for="record-text">확인한 내용 또는 추가 답변</label>
        <textarea id="record-text" required maxlength="4000" rows="5" placeholder="건국초 졸업식은 1월 6일 오전 10시래. 방금 학교에 전화해서 확인했어. 기록해줘."></textarea>
        <div class="actions"><button class="primary" type="submit">기록하기</button><button id="new-record" type="button">새 내용 적기</button></div>
      </form>
    </section>
  </div>
  <section class="results" aria-labelledby="results-title">
    <div class="results-heading"><h2 id="results-title">졸업식 일정표</h2>
    <div class="actions"><button id="refresh-results">새로 보기</button><button id="open-html">HTML 열기</button><button id="save-html" class="primary">HTML 저장</button></div></div>
    <div id="results" data-schedule>
      <div class="schedule-tools">
        <label class="schedule-search">학교명 검색<input type="search" data-control="query" placeholder="학교 이름"></label>
        <label>구<select data-control="district"><option value="">전체 구</option></select></label>
        <label>날짜<input type="date" data-control="date"></label>
        <button data-control="reset" type="button">전체 보기</button>
        <button data-control="print" type="button">인쇄</button>
      </div>
      <table class="schedule-table"><thead><tr><th scope="col">날짜</th><th scope="col">학교명</th><th scope="col">시간</th><th scope="col">졸업인원수</th><th scope="col">장소</th></tr></thead><tbody></tbody></table>
      <p class="empty" data-control="empty" hidden>조건에 맞는 학교가 없습니다.</p>
      <div class="schedule-footer"><span data-control="count" role="status"></span>
        <div class="paging"><button data-control="previous" type="button">이전</button><span data-control="page"></span><button data-control="next" type="button">다음</button></div>
      </div>
    </div>
  </section>
  <footer><details><summary>기록 관리</summary><div class="actions"><button id="backup">기록 백업 저장</button><button id="registry-sync">학교 목록 새로 가져오기</button></div></details><button id="shutdown">저장하고 프로그램 종료</button></footer>
  <dialog id="season-dialog"><form id="season-form"><h2>새 시즌 조사</h2>
    <p class="hint">찾을 졸업식의 실제 날짜를 선택해 주세요.<br>시작일과 종료일을 모두 포함해요.</p>
    <label>졸업식 시작 날짜<input id="season-start" name="search_start" type="date" required></label>
    <label>졸업식 끝 날짜<input id="season-end" name="search_end" type="date" required aria-describedby="season-limit"></label>
    <p id="season-limit" class="hint"></p>
    <div class="actions"><button id="season-submit" class="primary">조사 시작</button><button type="button" id="close-season">닫기</button></div>
  </form></dialog>
</main></body></html>
