[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gwangju-graduation-search-agent"
version = "0.1.0"
description = "근거와 검증 상태를 보존하는 광주 졸업식 일정 도우미"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.10,<3", "python-dotenv>=1,<2", "jsonschema[format]==4.25.1",
  "beautifulsoup4>=4.12,<5", "pypdf>=5,<7", "langgraph>=0.2,<2",
  "mcp>=1,<2", "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "markdown-it-py==4.0.0"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
