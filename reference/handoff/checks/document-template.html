<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실습 보고서 템플릿</title>
<style>
:root { --ink:#111111; --paper:#ffffff; --rule:#888888; --table-head:#9fc5e8; --grid:#a0a9b2; --navy:#17365d; --highlight:#fff2b2; --accent:#1756a9; --caution:#a33a16; }
* { box-sizing:border-box; }
html { background:#ededed; }
body { margin:0; color:var(--ink); font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; font-size:11pt; line-height:1.45; word-break:normal; overflow-wrap:anywhere; }
.report { width:210mm; margin:24px auto; padding:16mm 15mm 19mm; background:var(--paper); }
h1 { font-size:23pt; line-height:1.3; margin:0 0 12pt; font-weight:700; }
.author { text-align:right; font-size:12pt; font-weight:700; margin:0 0 23pt; }
h2 { border-top:0.5pt solid var(--rule); padding-top:15pt; margin:25pt 0 12pt; font-size:17pt; line-height:1.25; }
h3 { font-size:12.5pt; margin:18pt 0 10pt; line-height:1.3; }
h4 { font-size:11pt; margin:12pt 0 7pt; }
h1,h2,h3,h4 { break-after:avoid; }
h1,h2,h3,h4,thead th,tbody th { word-break:keep-all; overflow-wrap:anywhere; }
p { margin:0 0 10pt; orphans:3; widows:3; }
ul,ol { margin:7pt 0 12pt; padding-left:23pt; }
li { margin-bottom:4pt; }
table { width:100%; border-collapse:collapse; margin:12pt auto 16pt; font-size:10.5pt; line-height:1.4; table-layout:fixed; }
caption { text-align:left; font-size:9.5pt; font-weight:700; color:#333; margin-bottom:5pt; }
th,td { border:0.5pt solid var(--grid); padding:7pt 8pt; vertical-align:top; }
thead th { background:var(--table-head); border-bottom:0.75pt solid #586c7e; text-align:center; vertical-align:middle; font-weight:700; }
tbody th { text-align:left; font-weight:400; }
tbody th.center { vertical-align:middle; }
td { text-align:left; }
.center { text-align:center; }
.num { text-align:right; font-variant-numeric:tabular-nums; }
thead { display:table-header-group; }
tr { break-inside:avoid; }
figure { margin:14pt 0; text-align:center; break-inside:avoid; }
figure img,figure svg { max-width:100%; height:auto; }
figcaption { font-size:9.5pt; margin-top:7pt; text-align:center; }
.source { font-size:9pt; color:#444; }
a { color:inherit; text-decoration:underline; }
code { font-family:Menlo,Consolas,monospace; font-size:0.92em; overflow-wrap:anywhere; word-break:break-all; }
pre { background:#f4f4f4; padding:9pt; white-space:pre-wrap; overflow-wrap:anywhere; }
strong { font-weight:700; }
mark { background:var(--highlight); color:var(--ink); padding:0 .12em; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
.emphasis { color:var(--accent); font-weight:700; }
.caution { color:var(--caution); font-weight:700; }
.result-summary { margin:0 0 14pt; }
.preview-tools { max-width:210mm; margin:20px auto 0; padding:0 8px; display:flex; align-items:center; flex-wrap:wrap; gap:10px 20px; font-size:10pt; }
.preview-tools button { font:inherit; color:var(--navy); background:#fff; border:1px solid var(--grid); border-radius:3px; padding:6px 12px; cursor:pointer; }
@page {
 size:A4; margin:16mm 15mm 19mm;
 @bottom-center { content:counter(page); font-family:Arial,sans-serif; font-size:9pt; color:#555; }
}
@media print {
 html,body { background:white; }
 body { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
 .report { width:auto; padding:0; margin:0; }
 .preview-tools { display:none; }
 .page-break { break-before:page; }
}
@media screen and (max-width:820px) {
 .report { width:100%; margin:0; padding:24px 18px; }
 h1 { font-size:21pt; }
 table { font-size:10pt; }
 .preview-tools { padding:0 18px; margin-bottom:16px; }
}
</style>
</head>
<body><main class="report"></main></body>
</html>
